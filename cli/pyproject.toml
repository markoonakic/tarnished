[project]
name = "tarnished-cli"
version = "0.3.5"
description = "Command-line interface for Tarnished"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic>=2.12.0",
    "email-validator>=2.0.0",
    "typer>=0.23.1",
    "tzlocal>=5.3.1",
]

[project.urls]
Homepage = "https://markoonakic.github.io/tarnished/"
Repository = "https://github.com/markoonakic/tarnished"
Documentation = "https://markoonakic.github.io/tarnished/how-to/use-the-cli/"

[project.scripts]
tarnished = "tarnished_cli.main:app"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarnished_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B017",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
