services:
  # Prepare the bind mount for the non-root application.
  init:
    image: ${TARNISHED_IMAGE:-ghcr.io/markoonakic/tarnished:0.3.2}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - mkdir -p /app/data/uploads && chown -R 1000:1000 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  app:
    image: ${TARNISHED_IMAGE:-ghcr.io/markoonakic/tarnished:0.3.2}
    ports:
      - "${APP_PORT:-127.0.0.1:5577}:5577"
    volumes:
      - ./data:/app/data
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tarnished
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=tarnished
      - APP_URL=${APP_URL:-http://localhost:5577}
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=tarnished
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=tarnished
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
