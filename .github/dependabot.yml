version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-deps:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: uv
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli-deps:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      extension-deps:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /documentation
    schedule:
      interval: weekly
    groups:
      docs-deps:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
