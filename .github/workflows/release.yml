name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish only its image and Helm chart (for example v0.3.8)
        required: false
      version:
        description: Release version without the leading v (required unless tag is set)
        required: false
      ref:
        description: Git ref or commit SHA to publish (required unless tag is set)
        required: false
      publish_extension_assets:
        description: Upload Chrome and Firefox ZIPs
        type: boolean
        default: true
      publish_docker:
        description: Publish container images
        type: boolean
        default: true
      publish_helm:
        description: Publish the Helm chart
        type: boolean
        default: true
      publish_cli_package:
        description: Publish the CLI to PyPI
        type: boolean
        default: true
      publish_rolling_tags:
        description: Publish major.minor and latest container tags
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name) }}
  cancel-in-progress: false

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      docker_tags: ${{ steps.resolve.outputs.docker_tags }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve release metadata
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          ROLLING: ${{ inputs.publish_rolling_tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$INPUT_TAG" ]; then
              VERSION="${INPUT_TAG#v}"
              REF="$INPUT_TAG"
              test "$INPUT_TAG" = "v$VERSION"
              gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            else
              VERSION="$INPUT_VERSION"
              REF="$INPUT_REF"
              test -n "$REF"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
            REF="$GITHUB_SHA"
            ROLLING=true
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo 'Invalid release version' >&2
            exit 1
          fi
          REF="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq '.sha')"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tarnished"
          {
            echo "version=$VERSION"
            echo "ref=$REF"
            echo "release_tag=v$VERSION"
            echo "image=$IMAGE"
            echo 'docker_tags<<EOF'
            echo "$IMAGE:$VERSION"
            if [ "$ROLLING" = true ] && [[ "$VERSION" != *-* ]]; then
              echo "$IMAGE:${VERSION%.*}"
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
      - name: Verify release versions
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: python .github/release-tools/check_versions.py "$VERSION"

  checks:
    needs: release-meta
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}

  github-release-notes:
    runs-on: ubuntu-latest
    needs: [release-meta, checks]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
      - name: Create release and update notes
        if: inputs.tag == ''
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}
          REF: ${{ needs.release-meta.outputs.ref }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { printing=1; print; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$REF" --title "$TAG" --notes-file /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

  extension:
    runs-on: ubuntu-latest
    needs: [release-meta, github-release-notes]
    if: inputs.tag == '' && (github.event_name == 'push' || inputs.publish_extension_assets)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: corepack enable
      - name: Package extensions
        working-directory: extension
        run: |
          yarn install --immutable
          yarn build:all
      - name: Upload extension assets
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" extension/tarnished-chrome.zip extension/tarnished-firefox.zip --clobber

  cli-package:
    runs-on: ubuntu-latest
    needs: [release-meta, github-release-notes]
    if: inputs.tag == ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Build CLI distributions
        working-directory: cli
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-dist
          path: cli/dist/*
      - name: Upload CLI distributions
        env:
          TAG: ${{ needs.release-meta.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" cli/dist/* --clobber

  cli-pypi-publish:
    runs-on: ubuntu-latest
    needs: cli-package
    if: inputs.tag == '' && (github.event_name == 'push' || inputs.publish_cli_package)
    environment:
      name: pypi
      url: https://pypi.org/project/tarnished-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-dist
          path: cli/dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: cli/dist
          skip-existing: true

  docker:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [release-meta, github-release-notes]
    if: inputs.tag != '' || github.event_name == 'push' || inputs.publish_docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.release-meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-24.04
    needs: [release-meta, docker]
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge and tag platform images
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.release-meta.outputs.image }}
          TAGS: ${{ needs.release-meta.outputs.docker_tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ needs.release-meta.outputs.version }}"
      - name: Apply the reviewed JWT audit exception
        # Match the CI audit policy: every JWT reader pins its algorithm.
        # HS256 uses a private secret, not the DER public key in CVE-2026-85394.
        # See backend/tests/test_jwt_algorithm_policy.py for all four readers.
        run: printf 'CVE-2026-85394\n' > "$RUNNER_TEMP/tarnished-trivy.ignore"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          trivyignores: ${{ runner.temp }}/tarnished-trivy.ignore
          image-ref: ghcr.io/${{ github.repository_owner }}/tarnished:${{ needs.release-meta.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL

  helm:
    runs-on: ubuntu-latest
    needs: [release-meta, github-release-notes, docker, docker-merge]
    if: >-
      always() && !cancelled() &&
      needs.release-meta.result == 'success' &&
      needs.github-release-notes.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.docker-merge.result == 'success' || needs.docker.result == 'skipped') &&
      (inputs.tag != '' || github.event_name == 'push' || inputs.publish_helm)
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Publish Helm chart
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/tarnished --version "$VERSION" --app-version "$VERSION"
          helm push "tarnished-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
