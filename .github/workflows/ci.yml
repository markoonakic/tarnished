name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: tarnished
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: tarnished_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tarnished -d tarnished_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-not-for-production-use
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+asyncpg://tarnished:ci-postgres-password@localhost:5432/tarnished_test' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 ffmpeg poppler-utils
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint and type-check
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright app
          uv run bandit -c pyproject.toml -r app
      - name: Check migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+asyncpg://tarnished:ci-postgres-password@localhost:5432/tarnished_test' || 'sqlite+aiosqlite:///./data/ci.db' }}
        run: |
          mkdir -p data
          uv run alembic upgrade head
          uv run alembic check
      - name: Run tests
        working-directory: backend
        run: uv run pytest -q
      - name: Security audit
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements.txt
          # JWTs use HS256, not the vulnerable ecdsa algorithm.
          # CVE-2026-85394 requires algorithm confusion with a DER public key.
          # All four JWT readers pin the configured algorithm; HS256 uses a secret,
          # not a public key. See tests/test_jwt_algorithm_policy.py.
          uv tool run pip-audit -r requirements.txt --no-deps --disable-pip --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-85394

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Check CLI
        working-directory: cli
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pyright src tests
          uv run pytest -q
          uv build

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, extension, documentation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ matrix.project }}/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ matrix.project }}-${{ hashFiles(format('{0}/yarn.lock', matrix.project)) }}
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: yarn install --immutable
      - name: Frontend checks
        if: matrix.project == 'frontend'
        working-directory: frontend
        run: |
          yarn lint
          yarn format:check
          yarn test:run
          yarn build
          yarn npm audit --all --recursive --environment production --severity high
      - name: Extension checks
        if: matrix.project == 'extension'
        working-directory: extension
        run: |
          yarn format:check
          yarn exec tsc --noEmit
          yarn test:run
          yarn build:all
      - name: Documentation checks
        if: matrix.project == 'documentation'
        working-directory: documentation
        run: |
          yarn typecheck
          yarn build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          docker compose -f deploy/compose/docker-compose.yml config --quiet
          docker compose -f deploy/compose/docker-compose.postgres.yml config --quiet
      - name: Build production image
        run: docker build -t tarnished:ci .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Release tools tests
        run: python -m unittest discover -s .github/release-tools/tests
      - name: Check Helm configurations
        run: |
          helm lint deploy/helm/tarnished
          helm template tarnished ./deploy/helm/tarnished --set cleanup.enabled=true > /tmp/helm-cleanup.yaml
          for scenario in sqlite postgres postgres-rwx postgres-existing-claim; do
            args=()
            if [ "$scenario" != sqlite ]; then
              args+=(--set postgresql.enabled=true --set postgresql.host=postgres.example.test --set postgresql.password=ci-secret)
            fi
            case "$scenario" in
              postgres-rwx) args+=(--set persistence.accessMode=ReadWriteMany) ;;
              postgres-existing-claim) args+=(--set persistence.existingClaim=tarnished-uploads) ;;
            esac
            helm template tarnished ./deploy/helm/tarnished "${args[@]}" > "/tmp/helm-$scenario.yaml"
            if helm template tarnished ./deploy/helm/tarnished "${args[@]}" --set replicaCount=2 > "/tmp/helm-$scenario-ha.log" 2>&1; then
              echo "ERROR: $scenario accepted multiple replicas"
              exit 1
            fi
            grep -F 'Tarnished requires replicaCount=1 for SQLite and PostgreSQL; HA is unsupported' "/tmp/helm-$scenario-ha.log"
          done
